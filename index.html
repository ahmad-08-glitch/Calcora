<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1d2127;--muted:#6b7280;--key:#e9e6df;--fn:#dfe9e7;--op:#cfe5e1;--eq:#0f766e;--eqink:#fff;--line:#dcd8cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101311;--panel:#1a1e1b;--ink:#eef1ee;--muted:#98a29b;--key:#262b27;--fn:#1f2e2b;--op:#1d3b36;--eq:#2dd4bf;--eqink:#06201c;--line:#2c322d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101311;--panel:#1a1e1b;--ink:#eef1ee;--muted:#98a29b;--key:#262b27;--fn:#1f2e2b;--op:#1d3b36;--eq:#2dd4bf;--eqink:#06201c;--line:#2c322d;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px;gap:10px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--eq);color:var(--eqink)}
.hb{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.disp{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 16px;text-align:right;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}
.ex{color:var(--muted);font-size:18px;min-height:24px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.rs{font-size:44px;font-weight:600;overflow-x:auto;white-space:nowrap;scrollbar-width:none;line-height:1.15}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);min-height:16px}
.grid{display:grid;gap:8px}.grid[hidden]{display:none}
.k{border:0;border-radius:14px;background:var(--key);color:var(--ink);font-size:20px;font-family:inherit;min-height:54px;cursor:pointer;user-select:none}
.k:active{filter:brightness(.9);transform:scale(.97)}
.k.fn{background:var(--fn);font-size:16px}.k.op{background:var(--op);font-size:24px}
.k.eq{background:var(--eq);color:var(--eqink);font-size:26px;font-weight:600}
.k.sm{min-height:42px;font-size:14px}
#mem{grid-template-columns:repeat(4,1fr)}#pad{grid-template-columns:repeat(4,1fr)}
#sci{grid-template-columns:repeat(6,1fr);gap:4px 6px}#cpad{grid-template-columns:repeat(5,1fr);gap:4px 8px}
/* Casio fx-991ES style */
.casio .disp{background:#cde8e1;border-color:#93aea8;color:#12211e;border-radius:12px}
.casio .ex,.casio .meta{color:#3d5a54}
.casio #sci,.casio #cpad{background:linear-gradient(#d2d3ce,#bcbdb8);padding:10px 10px 8px;border:1px solid #a4a59f}
.casio #sci{border-radius:20px 20px 0 0;border-bottom:0;padding-bottom:2px}
.casio #cpad{border-radius:0 0 20px 20px;border-top:0;margin-top:-10px;padding-top:2px}
.ck{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl{font-size:11px;font-weight:700;color:#85570a;text-align:center;height:15px;line-height:15px;white-space:nowrap;border-radius:5px}
.shifton .sl:not(:empty){background:#85570a;color:#fff}
.k.fx{background:#2b2e39;color:#f4f4f2;font-size:15px;min-height:38px;border-radius:10px 10px 16px 16px;box-shadow:0 2px 0 #14151b}
.k.nm{background:#f6f6f3;color:#1d1f24;font-size:24px;font-weight:600;min-height:50px;border-radius:14px;box-shadow:0 3px 0 #9b9c97}
.k.nm.s{font-size:16px}
.k.or{background:#e0782a;color:#1a1208;font-weight:700;font-size:19px;box-shadow:0 3px 0 #9b4d10}
.k.sh{background:#3a4a8f;color:#fff;font-weight:700}
.casio .k.on{background:#f2b035;color:#1a1208}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.sheet.show{display:block}
.card{position:absolute;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;max-height:78%;background:var(--panel);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:center}
#hl{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.it{border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:right;cursor:pointer;background:none;color:var(--ink);font-family:inherit}
.it small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.it b{font-size:18px}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
.row{display:flex;gap:8px}.row button{flex:1}
.note{font-size:13px;color:var(--muted);text-align:center;letter-spacing:.3px;padding:4px 0 8px}
.note b{color:var(--eq);font-weight:800;letter-spacing:1.5px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="seg"><button id="bS">Simple</button><button id="bC">Scientific</button></div>
    <div style="display:flex;gap:6px"><button class="hb" id="sb" aria-label="Sound on or off">🔊</button><button class="hb" id="hb">🕘 History</button></div>
  </div>
  <div class="disp"><div class="ex" id="ex"></div><div class="rs" id="rs">0</div><div class="meta"><span id="mm"></span><span id="ang"></span></div></div>
  <div class="grid" id="mem"></div>
  <div class="grid" id="sci" hidden></div>
  <div class="grid" id="cpad" hidden></div>
  <div class="grid" id="pad"></div>
  <div class="note">Designed by <b>AHMAD</b></div>
</div>
<div class="sheet" id="sh"><div class="card">
  <h2>History <button class="hb" id="hx">Close</button></h2>
  <div id="hl"></div>
  <div class="row"><button class="hb" id="hc">Clear history</button></div>
</div></div>
<script>
var KEY="calc:v1", st={mode:"simple",ang:"deg",mem:0,hasMem:false,expr:"",ans:0,hist:[],sound:true}, done=false, shift=false, hyp=false, fracMode=false;
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in st)if(o[k]!==undefined)st[k]=o[k]}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

/* ---- safe expression parser (no eval) ---- */
var FN={sin:1,cos:1,tan:1,asin:1,acos:1,atan:1,sinh:1,cosh:1,tanh:1,asinh:1,acosh:1,atanh:1,ln:1,log:1,lb:1,sqrt:1,cbrt:1,abs:1,floor:1,ceil:1};
function evaluate(src,ang){
  var s=src.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/√/g,"sqrt").replace(/∛/g,"cbrt").replace(/π/g,"pi");
  var open=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;while(open-->0)s+=")";
  var re=/\d+\.?\d*(?:e[+-]?\d+)?|\.\d+|[a-z]+|[-+*\/^()!%]/g, t=s.match(re)||[];
  if(s.replace(re,"").trim()!==""||!t.length)throw 0;
  var i=0;
  function pk(){return t[i]}
  function isVal(x){return x!==undefined&&(/^[\d.]/.test(x)||x==="("||(/^[a-z]/.test(x)&&x!=="mod"&&x!=="npr"&&x!=="ncr"))}
  function expr(){var v=term();while(pk()==="+"||pk()==="-"){var o=t[i++],r=term();v=o==="+"?v+r:v-r}return v}
  function term(){var v=unary();for(;;){var p=pk();
    if(p==="*"||p==="/"||p==="mod"||p==="npr"||p==="ncr"){i++;var r=unary();v=p==="*"?v*r:p==="/"?v/r:p==="mod"?v-Math.floor(v/r)*r:cnt(v,r,p==="ncr")}
    else if(isVal(p)){v*=unary()}else break}return v}
  function unary(){if(pk()==="-"){i++;return -unary()}if(pk()==="+"){i++;return unary()}return pow()}
  function pow(){var b=post();if(pk()==="^"){i++;return Math.pow(b,unary())}return b}
  function post(){var v=prim();for(;;){if(pk()==="!"){i++;v=fact(v)}else if(pk()==="%"){i++;v=v/100}else break}return v}
  function cnt(n,r,comb){if(n<0||r<0||r>n||n>170||Math.floor(n)!==n||Math.floor(r)!==r)throw 0;var x=1;for(var k=0;k<r;k++){x*=(n-k);if(comb)x/=(k+1)}return x}
  function fact(n){if(n<0||n>170||Math.floor(n)!==n)throw 0;var r=1;for(var k=2;k<=n;k++)r*=k;return r}
  function prim(){var x=t[i++];if(x===undefined)throw 0;
    if(/^[\d.]/.test(x)){var n=parseFloat(x);if(isNaN(n))throw 0;return n}
    if(x==="("){var v=expr();if(t[i++]!==")")throw 0;return v}
    if(x==="pi")return Math.PI;if(x==="e")return Math.E;
    if(FN[x]){if(t[i++]!=="(")throw 0;var a=expr();if(t[i++]!==")")throw 0;return fn(x,a)}
    throw 0}
  function fn(f,a){var R=ang==="deg"?Math.PI/180:ang==="grad"?Math.PI/200:1,r;
    switch(f){case"sin":r=Math.sin(a*R);break;case"cos":r=Math.cos(a*R);break;case"tan":r=Math.tan(a*R);break;
    case"asin":r=Math.asin(a)/R;break;case"acos":r=Math.acos(a)/R;break;case"atan":r=Math.atan(a)/R;break;
    case"sinh":r=Math.sinh(a);break;case"cosh":r=Math.cosh(a);break;case"tanh":r=Math.tanh(a);break;
    case"asinh":r=Math.asinh(a);break;case"acosh":r=Math.acosh(a);break;case"atanh":r=Math.atanh(a);break;
    case"ln":r=Math.log(a);break;case"log":r=Math.log10(a);break;case"lb":r=Math.log2(a);break;
    case"sqrt":r=Math.sqrt(a);break;case"cbrt":r=Math.cbrt(a);break;case"abs":r=Math.abs(a);break;
    case"floor":r=Math.floor(a);break;case"ceil":r=Math.ceil(a);break}return r}
  var v=expr();if(i<t.length||typeof v!=="number"||!isFinite(v))throw 0;
  v=parseFloat(v.toPrecision(12));return v===0?0:v;
}
function frac(x){
  if(Number.isInteger(x))return null;
  var sg=x<0?"-":"",v=Math.abs(x),h0=0,h1=1,k0=1,k1=0,b=v;
  for(var i=0;i<30;i++){var a=Math.floor(b),h2=a*h1+h0,k2=a*k1+k0;h0=h1;h1=h2;k0=k1;k1=k2;
    if(k1>100000)return null;
    if(Math.abs(v-h1/k1)<1e-10*Math.max(1,v))return sg+h1+"/"+k1;
    var f=b-a;if(f<1e-12)break;b=1/f}
  return null;
}

/* ---- sounds (water bubbles, made in the browser) ---- */
var AC=null;
function ctxInit(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==="suspended")AC.resume()}catch(e){}}
function tone(f,d,type,vol,delay,to){
  if(!AC)return;var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);
}
function bub(f,d,vol,delay){tone(f,d,"sine",vol,delay,f*2.4);tone(f*3,d*0.5,"sine",vol*0.12,delay,f*6)}
function kindOf(v){
  if(/^[0-9.]$/.test(v))return "num";if(v==="AC")return "clear";if(v==="DEL")return "del";
  if(/^[+−×÷]$/.test(v))return "op";if(/^M[CRS+-]$/.test(v))return "mem";return "fn";
}
function sfx(k,v){
  if(!st.sound)return;ctxInit();if(!AC)return;
  try{
    if(k==="num"){var f=(v==="."?300:330+(+v)*38)*(0.94+Math.random()*0.12);bub(f,0.11,0.28,0)}
    else if(k==="op"){bub(210,0.17,0.32,0)}
    else if(k==="fn"){bub(640,0.07,0.2,0)}
    else if(k==="del"){tone(900,0.09,"sine",0.2,0,380)}
    else if(k==="clear"){bub(270,0.12,0.28,0);bub(205,0.14,0.28,0.1);bub(150,0.2,0.28,0.22)}
    else if(k==="mem"){bub(500,0.08,0.22,0);bub(760,0.08,0.2,0.08)}
    else if(k==="eq"){[380,470,590,740,930].forEach(function(f,i){bub(f,0.14,0.26,i*0.07)});bub(1150,0.28,0.3,0.4)}
    else if(k==="err"){tone(190,0.22,"sine",0.3,0,85);tone(160,0.22,"sine",0.25,0.16,75)}
    if(navigator.vibrate)navigator.vibrate(k==="eq"?[10,40,10]:k==="err"?[30,30,30]:6);
  }catch(e){}
}

/* ---- UI ---- */
var $=function(x){return document.getElementById(x)};
function render(){
  $("ex").textContent=st.expr;$("ex").scrollLeft=1e5;
  var rs=$("rs"),txt="0";
  if(st.expr){try{txt=String(evaluate(st.expr,st.ang))}catch(e){txt=done?"Error":""}}
  if(!st.expr)txt="0";
  if(txt===""){txt=rs.getAttribute("data-last")||"0"}else rs.setAttribute("data-last",txt);
  if(fracMode){var fv=parseFloat(txt),fr=isNaN(fv)?null:frac(fv);if(fr)txt=fr}
  rs.textContent=txt;rs.style.fontSize=txt.length>14?"28px":txt.length>9?"36px":"44px";
  var sc=st.mode==="sci";
  $("mm").textContent=st.hasMem?"M = "+st.mem:"";$("ang").textContent=sc?st.ang.toUpperCase():"";
  $("bS").className=sc?"":"on";$("bC").className=sc?"on":"";
  $("mem").hidden=sc;$("pad").hidden=sc;$("sci").hidden=!sc;$("cpad").hidden=!sc;
  $("app").classList.toggle("casio",sc);$("app").classList.toggle("shifton",shift);
  $("sb").textContent=st.sound?"🔊":"🔇";
  labelCas();save();
}
function cur(){try{return evaluate(st.expr||"0",st.ang)}catch(e){return null}}
function press(v){
  if(v!=="=")sfx(kindOf(v),v);
  if(v==="AC"){st.expr="";done=false;fracMode=false;return render()}
  if(v==="DEL"){if(done){st.expr="";done=false}else st.expr=st.expr.replace(/( mod | npr | ncr |[a-z]+\(|[√∛]\(|.)$/,"");return render()}
  if(v==="="){var r=cur();if(st.expr&&r!==null){sfx("eq");st.hist.unshift({e:st.expr,r:String(r)});st.hist=st.hist.slice(0,50);st.ans=r;st.expr=String(r);done=true}else if(st.expr){sfx("err");$("rs").textContent="Error";return}return render()}
  if(v==="RECIP"){if(st.expr){st.expr="1/("+st.expr+")";done=false}return render()}
  if(v==="ANG"){st.ang=st.ang==="deg"?"rad":st.ang==="rad"?"grad":"deg";return render()}
  if(v==="SD"){fracMode=!fracMode;return render()}
  if(v==="RAND"){ins(String(parseFloat(Math.random().toFixed(6))));return}
  if(v==="MC"){st.mem=0;st.hasMem=false;return render()}
  if(v==="MR"){if(st.hasMem)ins(String(st.mem));return}
  if(v==="MS"){var c0=cur();if(c0!==null){st.mem=c0;st.hasMem=true}return render()}
  if(v==="M+"||v==="M-"){var c2=cur();if(c2!==null){st.mem=parseFloat(((st.hasMem?st.mem:0)+(v==="M+"?c2:-c2)).toPrecision(12));st.hasMem=true}return render()}
  if(v==="NEG"){var c=cur();if(c!==null){st.expr=String(-c);done=false}return render()}
  if(v==="ANS"){return ins(String(st.ans))}
  ins(v);
}
function ins(v){
  fracMode=false;
  if(done){if(/^[\s+−×÷%^!]/.test(v)){}else st.expr="";done=false}
  var last=st.expr.slice(-1);
  if(v==="e"&&/[0-9.]$/.test(st.expr))v="×e";
  if(/^[+×÷]$/.test(v)&&/[+−×÷^]$/.test(last))st.expr=st.expr.slice(0,-1);
  st.expr+=v;render();
}
function mk(host,rows){
  var h=$(host);rows.forEach(function(r){var b=document.createElement("button");b.className="k "+(r[2]||"");b.textContent=r[0];
    b.addEventListener("click",function(){press(r[1])});h.appendChild(b)});
}
mk("mem",[["MC","MC","fn sm"],["MR","MR","fn sm"],["M+","M+","fn sm"],["M−","M-","fn sm"]]);
mk("pad",[["AC","AC","fn"],["⌫","DEL","fn"],["%","%","fn"],["÷","÷","op"],
["7","7"],["8","8"],["9","9"],["×","×","op"],["4","4"],["5","5"],["6","6"],["−","−","op"],
["1","1"],["2","2"],["3","3"],["+","+","op"],["±","NEG","fn"],["0","0"],[".","."],["=","=","eq"]]);

/* ---- scientific keys, laid out like a Casio fx-991ES ---- */
/* [label, action, shift label, shift action, style] */
var CF=[
["SHIFT","SHIFT","","","sh"],["DEG","ANG","","","fx"],["e","e","","","fx"],["mod"," mod ","log₂","lb(","fx"],["x⁻¹","RECIP","x!","!","fx"],["Rand","RAND","","","fx"],
["|x|","abs(","⌊x⌋","floor(","fx"],["√","√(","∛","∛(","fx"],["x²","^2","x³","^3","fx"],["xʸ","^","ʸ√x","^(1/","fx"],["log","log(","10ˣ","10^(","fx"],["ln","ln(","eˣ","e^(","fx"],
["(−)","−","⌈x⌉","ceil(","fx"],["π","π","","","fx"],["hyp","HYP","","","fx"],["sin","T:sin","","","fx"],["cos","T:cos","","","fx"],["tan","T:tan","","","fx"],
["RCL","MR","STO","MS","fx"],["MC","MC","","","fx"],["(","(","%","%","fx"],[")",")","","","fx"],["S⇔D","SD","","","fx"],["M+","M+","M−","M-","fx"],
["7","7","","","nm"],["8","8","","","nm"],["9","9","","","nm"],["DEL","DEL","","","or"],["AC","AC","","","or"],
["4","4","","","nm"],["5","5","","","nm"],["6","6","","","nm"],["×","×","nPr"," npr ","nm"],["÷","÷","nCr"," ncr ","nm"],
["1","1","","","nm"],["2","2","","","nm"],["3","3","","","nm"],["+","+","","","nm"],["−","−","","","nm"],
["0","0","","","nm"],[".",".","Ran#","RAND","nm"],["×10ˣ","×10^(","π","π","nm s"],["Ans","ANS","DRG▸","ANG","nm s"],["=","=","","","nm"]];
var CK=[];
function spec(d){
  if(/^T:/.test(d[1])){var b=d[1].slice(2)+(hyp?"h":"");return {l:b,sl:b+"⁻¹",p:b+"(",sp:"a"+b+"("}}
  return {l:(d[0]==="DEG"?st.ang.toUpperCase():d[0]),sl:d[2],p:d[1],sp:d[3]};
}
function kp(i){
  var d=CF[i],s=spec(d);
  if(d[1]==="SHIFT"){shift=!shift;sfx("fn");return render()}
  if(d[1]==="HYP"){hyp=!hyp;sfx("fn");return render()}
  var a=(shift&&s.sp)?s.sp:s.p;
  shift=false;if(/^T:/.test(d[1]))hyp=false;
  press(a);render();
}
function labelCas(){CK.forEach(function(c,i){var d=CF[i],s=spec(d);c[1].textContent=s.l;c[0].textContent=s.sl;
  c[1].classList.toggle("on",(d[1]==="SHIFT"&&shift)||(d[1]==="HYP"&&hyp))})}
CF.forEach(function(d,i){
  var w=document.createElement("div");w.className="ck";
  var s=document.createElement("span");s.className="sl";
  var b=document.createElement("button");b.className="k "+d[4];
  b.addEventListener("click",function(){kp(i)});
  w.appendChild(s);w.appendChild(b);$(i<24?"sci":"cpad").appendChild(w);CK.push([s,b]);
});

$("bS").onclick=function(){st.mode="simple";render()};
$("bC").onclick=function(){st.mode="sci";render()};
$("sb").onclick=function(){st.sound=!st.sound;if(st.sound){ctxInit();sfx("eq")}render()};

/* history */
function showHist(){
  var l=$("hl");l.innerHTML="";
  if(!st.hist.length){l.innerHTML='<div class="empty">No calculations yet.</div>'}
  st.hist.forEach(function(h){var b=document.createElement("button");b.className="it";
    var s=document.createElement("small");s.textContent=h.e+" =";var r=document.createElement("b");r.textContent=h.r;b.appendChild(s);b.appendChild(r);
    b.onclick=function(){st.expr=h.r;done=true;$("sh").classList.remove("show");render()};l.appendChild(b)});
  $("sh").classList.add("show");
}
$("hb").onclick=showHist;
$("hx").onclick=function(){$("sh").classList.remove("show")};
$("sh").addEventListener("click",function(e){if(e.target===this)this.classList.remove("show")});
$("hc").onclick=function(){st.hist=[];save();showHist()};

/* keyboard */
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;var k=e.key;
  if(/^[0-9.()]$/.test(k))press(k);
  else if(k==="+")press("+");else if(k==="-")press("−");else if(k==="*")press("×");else if(k==="/"){e.preventDefault();press("÷")}
  else if(k==="^")press("^");else if(k==="%")press("%");else if(k==="!")press("!");
  else if(k==="Enter"||k==="="){e.preventDefault();press("=")}
  else if(k==="Backspace")press("DEL");else if(k==="Escape")press("AC");
});

load();render();
</script>
